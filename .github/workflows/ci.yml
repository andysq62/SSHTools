name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Pester & PSScriptAnalyzer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester           -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Force

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./SSHTools.psd1 | Format-List Name, Version, ExportedFunctions

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $paths = @('./Public', './Private', './Tests', './SSHTools.psm1', './SSHTools.psd1')
          $results = foreach ($p in $paths) {
            Invoke-ScriptAnalyzer -Path $p -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($results) { $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host }
          $errors = @($results | Where-Object Severity -eq 'Error')
          "PSScriptAnalyzer: $($results.Count) finding(s), $($errors.Count) error(s)." | Write-Host
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer reported $($errors.Count) error(s)." }

      - name: Run Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path              = './Tests'
          $config.Run.Exit              = $true
          $config.Output.Verbosity      = 'Detailed'
          $config.TestResult.Enabled    = $true
          $config.TestResult.OutputPath = './testResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: ./testResults.xml
          if-no-files-found: warn
